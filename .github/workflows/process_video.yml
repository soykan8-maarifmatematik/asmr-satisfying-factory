name: Process and Publish Video
on:
  repository_dispatch:
    types: [video_uret]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create Secrets
        run: |
          # Secret değerlerini doğrudan çağırıp dosyaya yazıyoruz
          echo "${{ secrets.CLIENT_SECRETS_BASE64 }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          
          # HATA DENETİMİ: Dosyalar boş mu?
          echo "Dosya boyutları (0 byte ise secret boştur):"
          ls -lh client_secrets.json token.pickle
      - name: Process and Upload
        env:
          PAYLOAD_TITLE: ${{ github.event.client_payload.VIDEO_TITLE }}
          PATH_CAT: ${{ github.event.client_payload.category }}
        run: |
          mkdir -p output
          ffmpeg -y -i "content/shorts/$PATH_CAT/current_video.mp4" -filter_complex "[0:v]reverse[r];[0:v][r]concat=n=2:v=1:a=0[v]" -map "[v]" -c:v libx264 -crf 23 output/final_video.mp4
          python upload_to_youtube.py --file "output/final_video.mp4" --title "$PAYLOAD_TITLE"
