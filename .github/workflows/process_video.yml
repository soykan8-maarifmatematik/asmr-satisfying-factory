name: Process and Publish Video
on:
  repository_dispatch:
    types: [video_uret]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create Secrets
        run: |
          # Secret değerlerini kontrol et, eğer boşsa hata ver
          if [ -z "${{ secrets.CLIENT_SECRETS_BASE64 }}" ]; then echo "HATA: CLIENT_SECRETS_BASE64 bulunamadı!"; exit 1; fi
          if [ -z "${{ secrets.TOKEN_PICKLE_BASE64 }}" ]; then echo "HATA: TOKEN_PICKLE_BASE64 bulunamadı!"; exit 1; fi
          
          # Verileri güvenli şekilde dosyalara yaz (Tırnak sorunu yaşamamak için)
          printf "%s" "${{ secrets.CLIENT_SECRETS_BASE64 }}" | base64 -d > client_secrets.json
          printf "%s" "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          
          # Dosyaların oluştuğunu ve boyutunu logda doğrula
          echo "Dosya kontrolleri:"
          ls -lh client_secrets.json token.pickle
          
          # Dosya içeriğinin boş olmadığını doğrula
          echo "Dosya içeriği denetimi:"
          head -c 50 client_secrets.json
          echo "..."

      - name: Run Processing
        env:
          PAYLOAD_TITLE: ${{ github.event.client_payload.VIDEO_TITLE }}
          PAYLOAD_CAT: ${{ github.event.client_payload.category }}
          PAYLOAD_TYPE: ${{ github.event.client_payload.PAYLOAD_TYPE }}
        run: python server.py
