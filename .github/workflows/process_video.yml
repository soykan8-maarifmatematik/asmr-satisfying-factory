- name: Process and Upload
        env:
          PATH_CAT: ${{ github.event.client_payload.category }}
          TYPE: ${{ github.event.client_payload.type }}
        run: |
          mkdir -p output
          
          if [ "$TYPE" == "loop" ]; then
            # 1. Önce pinponlu 16 saniyelik temiz bir döngü oluştur
            ffmpeg -y -i "content/shorts/$PATH_CAT/current_video.mp4" -filter_complex "[0:v]reverse[r];[0:v][r]concat=n=2:v=1:a=0[v]" -c:v libx264 -crf 23 temp_loop.mp4
            
            # 2. Döngüyü 15 dakikaya (900 sn) tamamlamak için 16 saniyelik dosyayı 57 kez tekrarla
            # (900 / 16 = 56.25 -> 57 tekrar ile 15 dakikanın üzerini garanti ediyoruz)
            for i in {1..57}; do echo "file 'temp_loop.mp4'"; done > list.txt
            ffmpeg -y -f concat -safe 0 -i list.txt -c copy output/final_video.mp4
          else
            # Shorts için işlem yapmadan orjinali kullan
            cp "content/shorts/$PATH_CAT/current_video.mp4" output/final_video.mp4
          fi
          
          python upload_to_youtube.py --file "output/final_video.mp4" --category "$PATH_CAT"
