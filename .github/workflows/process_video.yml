name: Process and Publish Video
on:
  repository_dispatch:
    types: [video_uret]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Processing
        env:
          PAYLOAD_TITLE: ${{ github.event.client_payload.VIDEO_TITLE }}
          PAYLOAD_DESC: ${{ github.event.client_payload.VIDEO_DESC }}
          PAYLOAD_TAGS: ${{ github.event.client_payload.VIDEO_TAGS }}
          PAYLOAD_CAT: ${{ github.event.client_payload.category }}
        run: python server.py
