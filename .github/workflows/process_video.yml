name: Process and Publish Video
on:
  repository_dispatch:
    types: [video_uret]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create Secrets
        run: |
          # Secret'ları base64 -d ile dosyaya yazıyoruz
          echo "${{ secrets.CLIENT_SECRETS_BASE64 }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 -d > token.pickle
          
          # Dosyalar gerçekten oluştu mu kontrol et
          echo "Dosya boyutu kontrolü:"
          ls -lh client_secrets.json token.pickle
          
          # İlk 20 karakteri loga yazdır (dosya boşsa hata olduğunu anlarız)
          echo "Dosya içeriği başı:"
          head -c 20 client_secrets.json
          echo ""

      - name: Run Processing
        env:
          PAYLOAD_TITLE: ${{ github.event.client_payload.VIDEO_TITLE }}
          PAYLOAD_CAT: ${{ github.event.client_payload.category }}
          PAYLOAD_TYPE: ${{ github.event.client_payload.PAYLOAD_TYPE }}
        run: python server.py
