name: Process and Publish Video

on:
  repository_dispatch:
    types: [video_uret]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLIENT_SECRETS_BASE64: ${{ secrets.CLIENT_SECRETS_BASE64 }}
      TOKEN_PICKLE_BASE64: ${{ secrets.TOKEN_PICKLE_BASE64 }}
      
    steps:
      - uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Create Secrets
        run: |
          echo "$CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json
          echo "$TOKEN_PICKLE_BASE64" | base64 -d > token.pickle

      - name: Process and Upload
        env:
          PATH_CAT: ${{ github.event.client_payload.category }}
          TYPE: ${{ github.event.client_payload.type }}
        run: |
          mkdir -p output
          if [ "$TYPE" == "loop" ]; then
            # 1. Video ve sesi birlikte pinponla (ses tersine çevirme hatasını gidermek için)
            ffmpeg -y -i "content/shorts/$PATH_CAT/current_video.mp4" -filter_complex "[0:v]reverse[r];[0:a]areverse[ar];[0:v][r]concat=n=2:v=1:a=0[v];[0:a][ar]concat=n=2:v=0:a=1[a]" -map "[v]" -map "[a]" -c:v libx264 -c:a aac -crf 23 temp_loop.mp4
            # 2. Döngüyü 15 dakikaya tamamlamak için listele ve birleştir
            for i in {1..57}; do echo "file 'temp_loop.mp4'"; done > list.txt
            ffmpeg -y -f concat -safe 0 -i list.txt -c copy output/final_video.mp4
          else
            # Shorts için doğrudan kopyala
            cp "content/shorts/$PATH_CAT/current_video.mp4" output/final_video.mp4
          fi
          python upload_to_youtube.py --file "output/final_video.mp4" --category "$PATH_CAT"
